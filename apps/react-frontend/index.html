<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical and robots are set per route by the
         PageMeta component (React 19 hoists them into <head>); a static
         <title> here would win over the hoisted one in document order. -->
    <meta name="author" content="Resonect" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lora:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme and Design -->
    <meta name="theme-color" content="#ff6000" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff6000" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aiolos Weather" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aiolos.resonect.cz/" />
    <meta property="og:title" content="Aiolos — Live Wind for Vasiliki, Greece" />
    <meta
      property="og:description"
      content="Real-time wind speed, direction and gusts from Vasiliki Bay, Lefkada. Live windsurfing conditions straight from the Aiolos weather station."
    />
    <meta property="og:image" content="https://aiolos.resonect.cz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Aiolos Weather Station" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aiolos.resonect.cz/" />
    <meta property="twitter:title" content="Aiolos — Live Wind for Vasiliki, Greece" />
    <meta
      property="twitter:description"
      content="Real-time wind speed, direction and gusts from Vasiliki Bay, Lefkada. Live windsurfing conditions straight from the Aiolos weather station."
    />
    <meta property="twitter:image" content="https://aiolos.resonect.cz/og-image.png" />

    <!-- Additional Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
