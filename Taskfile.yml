version: "3"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  setup:
    desc: "Setup development environment (corepack pnpm, deps, git hooks)"
    cmds:
      - corepack enable pnpm
      - pnpm install --frozen-lockfile

  dev:
    desc: "Start API (:8080) + dashboard (:5173) with HMR"
    cmds:
      - pnpm dev

  dev:start:
    desc: "Run the full prod-like stack on :80 (Caddy + API + nginx frontend)"
    cmds:
      - docker compose -f infra/docker-compose.dev.yml up --build -d

  dev:stop:
    desc: "Stop and remove the full stack"
    cmds:
      - docker compose -f infra/docker-compose.dev.yml down

  build:
    desc: "Build all apps"
    cmds:
      - pnpm build

  test:
    desc: "Run the backend Japa suite"
    cmds:
      - pnpm test

  check:
    desc: "Full pre-PR gate: format, lint, types, tests"
    cmds:
      - pnpm format:check
      - pnpm exec turbo run lint check-types test

  format:
    desc: "Format the repo with oxfmt"
    cmds:
      - pnpm format

  db:migrate:
    desc: "Create/apply a dev migration (usage: task db:migrate -- --name add_x)"
    dir: apps/adonis-api
    cmds:
      - pnpm exec prisma migrate dev {{.CLI_ARGS}}

  db:seed:
    desc: "Run idempotent seeds"
    dir: apps/adonis-api
    cmds:
      - pnpm run seed

  firmware:build:
    desc: "Build ESP32 firmware"
    preconditions:
      - sh: test -f firmware/secrets.ini
        msg: "firmware/secrets.ini missing — copy firmware/secrets.ini.example"
    cmds:
      - pio run -e aiolos-esp32dev
