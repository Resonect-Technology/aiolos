# Local full-stack test: backend + nginx frontend behind Caddy on :80
# Usage: docker compose -f infra/docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: ../
      dockerfile: apps/adonis-api/Dockerfile
    image: aiolos-backend:dev
    env_file:
      - ../apps/adonis-api/.env
    environment:
      - DATABASE_URL=file:/data/db.sqlite3
    restart: unless-stopped
    volumes:
      - backend-data:/data
    expose:
      - 8080

  frontend:
    build:
      context: ../
      dockerfile: apps/react-frontend/Dockerfile
    image: aiolos-frontend:dev
    restart: unless-stopped
    expose:
      - 80

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:
