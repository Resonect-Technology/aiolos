name: "Setup Node.js and PNPM"
description: "Sets up Node.js, PNPM, and caching for monorepo builds"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24.x"

runs:
  using: "composite"
  steps:
    - name: Install PNPM
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Restore Turborepo Cache
      uses: actions/cache@v5
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('turbo.json', '**/package.json') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
          turbo-${{ runner.os }}-${{ runner.arch }}-main-
          turbo-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
