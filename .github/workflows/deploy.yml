name: Deploy Aiolos

# Deploys production when a GitHub Release (v* tag) is published — NOT on
# merges to main. Uses the `release` event (not `push: tags`) because
# [skip ci] in the release commit message suppresses tag-push events.
on:
  release:
    types: [published]
  workflow_dispatch: # Emergency redeploy escape hatch

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 590183887485.dkr.ecr.eu-central-1.amazonaws.com
  OIDC_ROLE: arn:aws:iam::590183887485:role/aiolos-prod-github-actions-oidc
  DEPLOY_CONFIG_BUCKET: aiolos-prod-deploy-config

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    name: Build & push backend image
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/adonis-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/aiolos-backend:latest
            ${{ env.ECR_REGISTRY }}/aiolos-backend:${{ github.sha }}
            ${{ github.event.release.tag_name && format('{0}/aiolos-backend:{1}', env.ECR_REGISTRY, github.event.release.tag_name) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    name: Build & push frontend image
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/react-frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/aiolos-frontend:latest
            ${{ env.ECR_REGISTRY }}/aiolos-frontend:${{ github.sha }}
            ${{ github.event.release.tag_name && format('{0}/aiolos-frontend:{1}', env.ECR_REGISTRY, github.event.release.tag_name) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production box
    runs-on: ubuntu-24.04-arm
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch instance id from SSM
        uses: ./.github/actions/fetch-ssm-secrets
        with:
          parameters: /aiolos/prod/infrastructure/ec2-instance-id
          prefix: /aiolos/prod/

      - name: Upload deploy configs to S3
        run: |
          aws s3 cp infra/prod/docker-compose.prod.yml "s3://$DEPLOY_CONFIG_BUCKET/configs/docker-compose.prod.yml"
          aws s3 cp infra/prod/traefik.yml "s3://$DEPLOY_CONFIG_BUCKET/configs/traefik.yml"

      - name: Deploy via SSM Run Command
        uses: ./.github/actions/ssm-run-command
        with:
          instance-id: ${{ env.INFRASTRUCTURE_EC2_INSTANCE_ID }}
          s3-bucket: ${{ env.DEPLOY_CONFIG_BUCKET }}
          comment: "Aiolos production deploy ${{ github.event.release.tag_name || github.sha }}"
          timeout-seconds: "900"
          commands: |
            set -e

            cleanup() {
              if [ $? -ne 0 ]; then
                echo "=== Deploy failed — diagnostics ==="
                docker compose -f /opt/aiolos/docker-compose.prod.yml ps || true
                docker logs --tail 50 aiolos-backend 2>&1 || true
              fi
            }
            trap cleanup EXIT

            mkdir -p /opt/aiolos/data /opt/aiolos/acme

            echo "=== Sync configs from S3 ==="
            aws s3 cp "s3://aiolos-prod-deploy-config/configs/docker-compose.prod.yml" /opt/aiolos/docker-compose.prod.yml
            aws s3 cp "s3://aiolos-prod-deploy-config/configs/traefik.yml" /opt/aiolos/traefik.yml

            echo "=== Render env files from SSM ==="
            get_ssm() {
              aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text --region eu-central-1
            }
            cat > /opt/aiolos/.env.prod <<ENVEOF
            TZ=$(get_ssm /aiolos/prod/config/tz)
            PORT=$(get_ssm /aiolos/prod/config/port)
            HOST=$(get_ssm /aiolos/prod/config/host)
            LOG_LEVEL=$(get_ssm /aiolos/prod/config/log-level)
            NODE_ENV=$(get_ssm /aiolos/prod/config/node-env)
            DATABASE_URL=$(get_ssm /aiolos/prod/config/database-url)
            APP_KEY=$(get_ssm /aiolos/prod/backend/app-key)
            ADMIN_API_KEY=$(get_ssm /aiolos/prod/backend/admin-api-key)
            ENVEOF
            cat > /opt/aiolos/.env.traefik <<ENVEOF
            CF_DNS_API_TOKEN=$(get_ssm /aiolos/prod/traefik/cf-dns-api-token)
            ENVEOF
            chmod 600 /opt/aiolos/.env.prod /opt/aiolos/.env.traefik

            echo "=== Pull and start ==="
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 590183887485.dkr.ecr.eu-central-1.amazonaws.com
            cd /opt/aiolos
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180

            echo "=== Prune old images ==="
            docker image prune -f

            echo "=== Deploy complete ==="
            docker compose -f docker-compose.prod.yml ps
