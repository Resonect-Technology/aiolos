name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: error
      APP_KEY: copilot-test-key-0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node and PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Set up firmware secrets for PlatformIO
        run: cp firmware/secrets.ini.example firmware/secrets.ini

      - name: Build projects
        run: pnpm exec turbo run build

      - name: Setup summary
        run: |
          echo "## Copilot Setup Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js $(node --version), pnpm $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "- PlatformIO $(pio --version)" >> $GITHUB_STEP_SUMMARY
